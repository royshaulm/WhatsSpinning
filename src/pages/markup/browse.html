<div class="screen" id="screen-browse">
<div class="topbar">
<button class="back" onclick="showScreen('home')" title="Home">‹</button>
<div class="page-title"><img alt="" src="/assets/legacy/79e70654b2cc8b5e.png"/><span data-i18n="nav.title.browse">האוסף שלי</span></div>
<div class="topbar-right">
<span class="count-pill" id="browseCount"></span>
<button class="fab-add fab-icon-only" onclick="showScreen('incoming')" title="On the way"><img alt="🚚" src="/assets/legacy/bb6027b6ff840750.png"/></button>
<button class="fab-add fab-icon-only" onclick="showScreen('wishlist')" title="Wishlist"><img alt="Wishlist" src="/assets/legacy/3f6cd46a5b2b0cfe.png"/></button>
<button class="fab-add" data-i18n-title="browse.addTitle" onclick="showScreen('quickadd')" title="הוספת תקליטים">➕</button>
</div>
</div>
<div class="filter-bar browse-primary-controls" id="browsePrimaryControls"></div>
<div class="filter-bar" id="filterBar"></div>
<div class="letter-row hidden" id="letterRow"></div>
<div class="filter-bar" id="filterBarRow2" style="margin-top:-4px;"></div>
<input class="search-box" data-i18n-ph="browse.searchPh" id="browseSearchInput" oninput="setFilterAndRender({search:this.value})" placeholder="חיפוש לפי אמן, אלבום, שיר או סגנון…" type="text"/>
<div class="hint" data-i18n="browse.hint" style="margin-bottom:6px;">לוחצים על תקליט כדי לפתוח את דף התקליט, או על ➕ למעלה כדי להוסיף חדש</div>
<div class="card" id="browseList" style="max-height:54vh;overflow:auto;padding:6px 14px;"></div>
</div>
